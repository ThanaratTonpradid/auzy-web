# Production compose for DigitalOcean Basic $6 (1 vCPU / 1GB RAM)
# Usage:
#   cp deploy/.env.example deploy/.env   # edit secrets
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build

services:
  mysql:
    image: mysql:9.7
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql.cnf:/etc/mysql/conf.d/auzy.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-auzy}
      MYSQL_USER: ${MYSQL_USER:-auzy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 450m

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 96m

  api:
    build:
      context: ../apps/admin-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "1323"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MYSQL_DSN: ${MYSQL_USER:-auzy}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:-auzy}?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      AUTH_TOKEN: ${AUTH_TOKEN}
      INIT_DATA: ${INIT_DATA:-true}
      DEFAULT_DEV_PASSWORD: ${DEFAULT_DEV_PASSWORD}
    mem_limit: 192m

  ui:
    build:
      context: ..
      dockerfile: deploy/ui.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_APP_NAME: ${VITE_APP_NAME:-Auzy}
        VITE_PROFILE_NAME: ${VITE_PROFILE_NAME:-Auzy}
        VITE_PROFILE_TITLE: ${VITE_PROFILE_TITLE:-Personal profile}
        VITE_PROFILE_BIO: ${VITE_PROFILE_BIO:-A quiet corner of the internet.}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    mem_limit: 64m

volumes:
  mysql_data:
  redis_data:
